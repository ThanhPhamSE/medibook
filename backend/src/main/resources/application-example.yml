spring:
    datasource:
        url: jdbc:mysql://localhost:3306/medibook?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh
        username: root
        password: YOUR_DB_PASSWORD

    jpa:
        hibernate:
            ddl-auto: validate
        open-in-view: false
        show-sql: true
        properties:
            hibernate:
                format_sql: true

    flyway:
        enabled: true
        baseline-on-migrate: true
        locations: classpath:db/migration

server:
    port: 8080

jwt:
    secret: YOUR_SUPER_SECRET_KEY_MIN_32_CHARS
    access-token-expiration: 3600000
    refresh-token-expiration: 604800000

app:
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
