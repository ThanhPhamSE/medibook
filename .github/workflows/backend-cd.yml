name: Backend CD

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login GHCR
        shell: powershell
        run: |
          "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Pull newest image
        shell: powershell
        run: |
          docker compose pull

      - name: Restart containers
        shell: powershell
        run: |
          docker compose up -d

      - name: Remove old images
        shell: powershell
        run: |
          docker image prune -f